name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  mock:
    name: rust (no OpenFHE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Every example that needs no cloud account or crypto build, checked
  # against its expected output.
  examples-smoke:
    name: examples (standard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "peft==0.12.0"
          maturin develop
      # Confidential fine-tuning is a release gate: end to end, commitments,
      # canary leakage, crash and kill recovery, the Rust contract,
      # patient-level DP-SGD and Hugging Face + PEFT.
      - name: confidential fine-tuning
        run: |
          . .venv/bin/activate
          pytest -q python/tests/test_finetune.py python/tests/test_finetune_matrix.py \
            python/tests/test_finetune_leakage.py python/tests/test_finetune_crash.py \
            python/tests/test_training_contract.py python/tests/test_dpsgd.py \
            python/tests/test_huggingface.py python/tests/test_confidential_job.py
      - run: EXAMPLES_REQUIRE="15 16 17 18" examples/run-all.sh standard

  # The Confidential Space training worker image: built as released
  # (linux/amd64), then run against a locally prepared job with a
  # production broker and a simulated launcher inside the container. A
  # rebuilt (tampered) image must get no key. No GCP needed; the live test
  # is confidential-space-live.yml.
  confidential-space-image:
    name: confidential space training image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r deploy/confidential-space-training/requirements.txt
          maturin develop
      - name: build the approved and a tampered image
        run: |
          D=deploy/confidential-space-training/Dockerfile
          # The production image: no CLI inside.
          docker build -f $D -t encompute-training:production .
          docker run --rm --entrypoint sh encompute-training:production -c '! command -v encompute'
          docker image inspect encompute-training:production --format '{{.Id}}' >> "$GITHUB_STEP_SUMMARY"
          # The rehearsal images (the same layers plus the CLI).
          docker build --target rehearsal -f $D -t encompute-training:approved .
          docker build --target rehearsal --build-arg VARIANT=tampered -f $D -t encompute-training:tampered .
      - name: the approved image trains; the tampered image gets no key
        run: |
          . .venv/bin/activate
          export ENCOMPUTE_CLI="$PWD/target/debug/encompute"
          python examples/18_confidential_space_hf/job.py container "$RUNNER_TEMP/approved"
          python examples/18_confidential_space_hf/job.py container "$RUNNER_TEMP/tampered" \
            --run encompute-training:tampered

  # The release gate: every documented security invariant, quick scale.
  # Fails the build when any invariant is violated (docs/assurance.md).
  assurance:
    name: assurance (security invariants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p encompute-assurance --bins --examples
      - run: ./target/release/assurance-report --json assurance-report.json --md assurance-report.md
      - if: always()
        run: cat assurance-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assurance-report
          path: assurance-report.*

  openfhe:
    name: openfhe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: actions/cache@v6
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo clippy --workspace --all-targets --features encompute-runtime/openfhe,encompute-evaluator/openfhe,encompute-cli/openfhe -- -D warnings
      - run: cargo test --workspace --release --features encompute-runtime/openfhe,encompute-evaluator/openfhe,encompute-cli/openfhe
      - name: verified execution (re-execution proofs on OpenFHE BGV, research)
        run: |
          cargo clippy -p encompute-runtime -p encompute-cli -p encompute-vfhe --all-targets --features encompute-runtime/vfhe-research,encompute-cli/vfhe-research -- -D warnings
          cargo test --release -p encompute-runtime --features vfhe-research --test vfhe -- --nocapture
      - name: evaluator links no client crypto
        run: |
          cargo build --release -p encompute-evaluator --features openfhe
          ./scripts/audit-evaluator-binary.sh
      - name: exact demo on OpenFHE exact (separate evaluator process)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p encompute-cli -p encompute-evaluator --features encompute-cli/openfhe,encompute-evaluator/openfhe
          ./scripts/exact-demo.sh
      - name: commercial build audit (no TFHE-rs in production artifacts)
        run: |
          cargo build --release -p encompute-cli -p encompute-evaluator --features encompute-cli/openfhe,encompute-evaluator/openfhe
          ./scripts/audit-commercial-build.sh target/release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy
          maturin develop --release --features openfhe
          pytest -q
          python examples/01_ckks_private_inference/semantic_search.py
      - name: crypto examples (OpenFHE)
        run: |
          cargo build --release --bins --features encompute-cli/openfhe,encompute-evaluator/openfhe -p encompute-cli -p encompute-evaluator
          BIN=target/release examples/run-all.sh crypto

  two-machine-demo:
    name: two-machine demo (client ↔ evaluator container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo build --release --features openfhe -p encompute-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: client SDK
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          maturin develop --release --features openfhe
      - name: demo
        run: PYTHON=.venv/bin/python ./scripts/two-machine-demo.sh

  exact-research:
    name: exact backend (TFHE-rs, research feature)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p encompute-tfhe -p encompute-tfhe-client -p encompute-runtime -p encompute-evaluator -p encompute-cli --all-targets --features encompute-tfhe-client/research-tfhe-rs,encompute-runtime/research-tfhe-rs,encompute-evaluator/research-tfhe-rs,encompute-cli/research-tfhe-rs -- -D warnings
      - run: cargo test --release -p encompute-tfhe -p encompute-tfhe-client --features encompute-tfhe-client/research-tfhe-rs
      - run: cargo test --release -p encompute-runtime --features research-tfhe-rs --test exact
      - name: research evaluator links no client crypto
        run: |
          cargo build --release -p encompute-cli -p encompute-evaluator --features encompute-cli/research-tfhe-rs,encompute-evaluator/research-tfhe-rs
          ./scripts/audit-evaluator-binary.sh target/release/encompute-evaluator
      - name: negative control (the commercial audit must reject research binaries)
        run: |
          if ./scripts/audit-commercial-build.sh target/release; then
            echo "commercial audit passed on a research build"; exit 1
          fi
