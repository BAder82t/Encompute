name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  mock:
    name: rust (no OpenFHE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  openfhe:
    name: openfhe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: actions/cache@v4
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --release
      - name: evaluator links no client crypto
        run: |
          cargo build --release -p encompute-evaluator --features openfhe
          ./scripts/audit-evaluator-binary.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy
          maturin develop --release --features openfhe
          pytest -q
          python examples/semantic_search.py
