name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  mock:
    name: rust (no OpenFHE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Every example that needs no cloud account or crypto build, checked
  # against its expected output.
  examples-smoke:
    name: examples (standard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          maturin develop
          pytest -q python/tests/test_finetune.py
      - run: examples/run-all.sh standard

  # The release gate: every documented security invariant, quick scale.
  # Fails the build when any invariant is violated (docs/assurance.md).
  assurance:
    name: assurance (security invariants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p encompute-assurance --bins --examples
      - run: ./target/release/assurance-report --json assurance-report.json --md assurance-report.md
      - if: always()
        run: cat assurance-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assurance-report
          path: assurance-report.*

  openfhe:
    name: openfhe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: actions/cache@v6
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo clippy --workspace --all-targets --features encompute-runtime/openfhe,encompute-evaluator/openfhe,encompute-cli/openfhe -- -D warnings
      - run: cargo test --workspace --release --features encompute-runtime/openfhe,encompute-evaluator/openfhe,encompute-cli/openfhe
      - name: verified execution (re-execution proofs on OpenFHE BGV, research)
        run: |
          cargo clippy -p encompute-runtime -p encompute-cli -p encompute-vfhe --all-targets --features encompute-runtime/vfhe-research,encompute-cli/vfhe-research -- -D warnings
          cargo test --release -p encompute-runtime --features vfhe-research --test vfhe -- --nocapture
      - name: evaluator links no client crypto
        run: |
          cargo build --release -p encompute-evaluator --features openfhe
          ./scripts/audit-evaluator-binary.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy
          maturin develop --release --features openfhe
          pytest -q
          python examples/01_ckks_private_inference/semantic_search.py
      - name: crypto examples (OpenFHE)
        run: |
          cargo build --release --bins --features encompute-cli/openfhe,encompute-evaluator/openfhe -p encompute-cli -p encompute-evaluator
          BIN=target/release examples/run-all.sh crypto

  two-machine-demo:
    name: two-machine demo (client ↔ evaluator container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo build --release --features openfhe -p encompute-cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: client SDK
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          maturin develop --release --features openfhe
      - name: demo
        run: PYTHON=.venv/bin/python ./scripts/two-machine-demo.sh

  exact-research:
    name: exact backend (TFHE-rs, research feature)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p encompute-tfhe -p encompute-tfhe-client -p encompute-runtime -p encompute-evaluator -p encompute-cli --all-targets --features encompute-tfhe-client/tfhe-rs,encompute-runtime/tfhe-rs,encompute-evaluator/tfhe-rs,encompute-cli/tfhe-rs -- -D warnings
      - run: cargo test --release -p encompute-tfhe -p encompute-tfhe-client --features encompute-tfhe-client/tfhe-rs
      - run: cargo test --release -p encompute-runtime --features tfhe-rs --test exact
      - name: exact demo through a separate evaluator process
        run: |
          cargo build --release -p encompute-cli -p encompute-evaluator --features encompute-cli/tfhe-rs,encompute-evaluator/tfhe-rs
          ./scripts/audit-evaluator-binary.sh target/release/encompute-evaluator
