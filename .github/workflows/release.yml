name: release

# Builds a release candidate or release from a tag, runs every release gate,
# signs every artifact (Sigstore keyless, GitHub OIDC) and creates a DRAFT
# GitHub release. Nothing is published automatically: a maintainer reviews
# the draft and publishes it (docs/release-process.md).
#
#   push a tag v0.3.0-rc.1 (on release/0.3)   -> the full pipeline and a draft
#   workflow_dispatch                          -> a dry run: artifacts only, no release
#
# Actions are pinned by commit; the comment names the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  TRIVY_VERSION: "0.74.0"
  COSIGN_VERSION: "v3.1.3"

jobs:
  prepare:
    name: version and source archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      epoch: ${{ steps.v.outputs.epoch }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - id: v
        name: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            TAG="${GITHUB_REF_NAME}"
            scripts/release/check-version.sh "$TAG"
            V="${TAG#v}"
          else
            TAG=""
            V="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)-dev.$(git rev-parse --short=12 HEAD)"
          fi
          case "$V" in *-rc.*|*-dev.*) PRE=true ;; *) PRE=false ;; esac
          {
            echo "version=$V"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - name: pins
        run: scripts/release/check-pins.sh --network
      - name: source archive (git archive, deterministic for the commit)
        run: |
          V="${{ steps.v.outputs.version }}"
          mkdir -p dist
          git archive --format=tar --prefix="encompute-$V/" HEAD | gzip -n -9 > "dist/encompute-$V-source.tar.gz"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  binaries:
    name: binaries and wheel (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      V: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - if: runner.os == 'macOS'
        run: brew install libomp
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # No build cache: a release builds from a clean state.
      - name: OpenFHE (pinned tag, commit verified)
        run: ./scripts/install-openfhe.sh
      - name: release binaries
        run: |
          . scripts/release/env.sh "$PWD/target"
          export OPENFHE_ROOT="$PWD/.deps/openfhe"
          cargo build --release --locked -p encompute-cli -p encompute-evaluator -p encompute-control \
            --features encompute-cli/openfhe,encompute-evaluator/openfhe
          ./scripts/audit-evaluator-binary.sh target/release/encompute-evaluator
      - name: Python wheel
        run: |
          python -m venv .venv
          # maturin from the lock, hashes checked.
          awk '/^maturin==/{p=1; print; next} p && /^[a-z]/{p=0} p' scripts/release/python/constraints.txt > "$RUNNER_TEMP/maturin.txt"
          .venv/bin/pip install --require-hashes --no-deps -r "$RUNNER_TEMP/maturin.txt"
          . scripts/release/env.sh "$PWD/target"
          export OPENFHE_ROOT="$PWD/.deps/openfhe"
          .venv/bin/maturin build --release --locked --features openfhe --auditwheel repair \
            -m crates/encompute-py/Cargo.toml -o wheels
          ls -l wheels
      - name: commercial dependency audit (binaries and wheel)
        run: WHEELS="$(ls wheels/*.whl)" ./scripts/audit-commercial-build.sh target/release
      - name: package, SBOMs
        run: |
          mkdir -p dist
          T="${{ matrix.target }}"
          python3 scripts/release/pack.py "dist/encompute-$V-$T.tar.gz" "encompute-$V-$T" \
            target/release/encompute target/release/encompute-evaluator target/release/encompute-control \
            LICENSE LICENSING.md THIRD_PARTY_NOTICES.md
          cp wheels/*.whl dist/
          W="$(ls dist/*.whl)"
          python3 scripts/release/python_licenses.py scripts/release/python/constraints.txt \
            --json target/python-licenses.json
          python3 scripts/sbom.py --artifact cli --file target/release/encompute -o "dist/encompute-$V-$T.encompute.cdx.json"
          python3 scripts/sbom.py --artifact evaluator --file target/release/encompute-evaluator -o "dist/encompute-$V-$T.encompute-evaluator.cdx.json"
          python3 scripts/sbom.py --artifact control --file target/release/encompute-control -o "dist/encompute-$V-$T.encompute-control.cdx.json"
          python3 scripts/sbom.py --artifact wheel --file "$W" --python-lock scripts/release/python/constraints.txt \
            --python-licenses target/python-licenses.json -o "$W.cdx.json"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  images:
    name: container images
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to GHCR (new packages are private until a maintainer changes that)
      id-token: write        # Sigstore keyless signing
      attestations: write    # GitHub build provenance
    env:
      V: ${{ needs.prepare.outputs.version }}
      REG: ${{ needs.prepare.outputs.registry }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - id: evaluator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.evaluator
          platforms: linux/amd64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ env.REG }}/encompute-evaluator:${{ env.V }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
      - id: control
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.control
          platforms: linux/amd64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ env.REG }}/encompute-control:${{ env.V }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
      - id: services
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.services
          platforms: linux/amd64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ env.REG }}/encompute-services:${{ env.V }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
      # The Confidential Space workloads: the images a TEE measures and the
      # key brokers release keys to. Built from digest-pinned bases and
      # hash-locked Python packages, then audited, SBOM'd, signed and
      # attested like the others, so an approver can match the digest they
      # approve to this release.
      - id: cs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/confidential-space/Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ env.REG }}/encompute-confidential-space:${{ env.V }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
      - id: training
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/confidential-space-training/Dockerfile
          target: production
          platforms: linux/amd64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: ${{ env.REG }}/encompute-training:${{ env.V }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
      - id: refs
        name: image references (by digest)
        run: |
          {
            echo "$REG/encompute-evaluator@${{ steps.evaluator.outputs.digest }}"
            echo "$REG/encompute-control@${{ steps.control.outputs.digest }}"
            echo "$REG/encompute-services@${{ steps.services.outputs.digest }}"
          } > images.txt
          {
            echo "$REG/encompute-confidential-space@${{ steps.cs.outputs.digest }}"
            echo "$REG/encompute-training@${{ steps.training.outputs.digest }}"
          } > tee-images.txt
          cat images.txt tee-images.txt
          # The release check scans every image, the TEE workloads included:
          # signing and attestation say which image ran, not that it has no
          # known vulnerabilities.
          echo "refs=$(cat images.txt tee-images.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: SBOMs, commercial audit
        run: |
          mkdir -p dist
          cp images.txt "dist/encompute-$V-images.txt"
          cp tee-images.txt "dist/encompute-$V-tee-images.txt"
          while read -r ref; do
            n="${ref##*/}"; n="${n%@*}"
            syft -q "$ref" -o "cyclonedx-json=dist/$n-$V.image.cdx.json"
          done < <(cat images.txt tee-images.txt)
          IMAGES="$(cat images.txt tee-images.txt | tr '\n' ' ')" ./scripts/audit-commercial-build.sh /nonexistent
      - name: sign images and attach SBOM attestations (cosign keyless)
        run: |
          while read -r ref; do
            n="${ref##*/}"; n="${n%@*}"
            cosign sign --yes "$ref"
            cosign attest --yes --type cyclonedx --predicate "dist/$n-$V.image.cdx.json" "$ref"
          done < <(cat images.txt tee-images.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/encompute-evaluator
          subject-digest: ${{ steps.evaluator.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/encompute-control
          subject-digest: ${{ steps.control.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/encompute-services
          subject-digest: ${{ steps.services.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/encompute-confidential-space
          subject-digest: ${{ steps.cs.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REG }}/encompute-training
          subject-digest: ${{ steps.training.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: dist/*
          if-no-files-found: error

  # The one-command release check, as documented, with the services and the
  # released images. A required row that fails or is skipped stops the release.
  release-check:
    name: release check (all gates)
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: encompute
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: encompute
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      openbao:
        image: openbao/openbao:2.1.0
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add IPC_LOCK
    env:
      ENCOMPUTE_TEST_DATABASE_URL: postgres://encompute:ci-only-password@127.0.0.1:5432/encompute
      ENCOMPUTE_TEST_BAO_ADDR: http://127.0.0.1:8200
      ENCOMPUTE_TEST_BAO_TOKEN: ci-root
      IMAGES: ${{ needs.images.outputs.refs }}
      # scan.sh fails unless each of these was among the scanned images.
      REQUIRE_IMAGES: encompute-evaluator encompute-control encompute-services encompute-confidential-space encompute-training
      REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny,cargo-audit
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: trivy, pip-audit, PostgreSQL client
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          sudo tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C /usr/local/bin trivy
          python -m pip install -q "pip-audit==2.10.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: ./scripts/install-openfhe.sh
      # Cold databases throughout (the release check sets that), and the test
      # runner proven to fail on a missing service or an empty suite.
      - run: ./scripts/test-full-selftest.sh
      - name: scripts/release-check.sh
        run: ./scripts/release-check.sh --repro
      - if: always()
        name: reports
        run: |
          mkdir -p reports
          cp -r target/release-scan target/sbom reports/ 2>/dev/null || true
          [ -f target/release-scan/vulnerabilities.md ] && cat target/release-scan/vulnerabilities.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-reports
          path: reports/

  release:
    name: checksums, signatures, draft release
    needs: [prepare, binaries, images, release-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # the draft release
      id-token: write        # Sigstore keyless signing
      attestations: write    # GitHub build provenance
    env:
      V: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          # Refuse an empty artifact (the digest of no bytes).
          ! grep -q '^e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 ' SHA256SUMS
      - name: sign every file (cosign keyless, Sigstore bundles)
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: draft release (never published automatically)
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=(); [ "${{ needs.prepare.outputs.prerelease }}" = true ] && PRE=(--prerelease)
          {
            echo "Encompute $V: draft created by the release workflow from ${GITHUB_SHA}."
            echo
            echo "Verify before use: docs/verify-release.md (checksums, cosign signatures, GitHub attestations)."
            echo
            echo "Container images (by digest):"
            echo '```'
            cat "dist/encompute-$V-images.txt"
            echo '```'
            echo
            echo "Confidential Space workload images (by digest; the digests key brokers approve):"
            echo '```'
            cat "dist/encompute-$V-tee-images.txt"
            echo '```'
          } > notes.md
          gh release create "$TAG" --draft --verify-tag "${PRE[@]}" \
            --title "Encompute $V" --notes-file notes.md dist/*
      - name: dry run (workflow_dispatch) keeps artifacts only
        if: needs.prepare.outputs.tag == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-dry-run
          path: dist/*
