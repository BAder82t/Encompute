name: assurance

# The assurance suite at nightly scale (larger populations, 100 racing
# processes, repeated crash injection) and supply-chain checks. See
# docs/assurance.md.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p encompute-assurance --bins --examples
      - run: ./target/release/assurance-report --nightly --json assurance-report.json --md assurance-report.md
      - if: always()
        run: cat assurance-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-report-nightly
          path: assurance-report.*

  # Every example this machine can run, and every attack in the full
  # collaboration.
  examples-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "peft==0.12.0"
          maturin develop
      - run: examples/run-all.sh full

  # From a clean checkout to a trusted adapter, with documented commands only.
  #
  # Every row the release check requires must run: it needs OpenFHE and the
  # control-plane services, as the release workflow's job has, or a required
  # row is skipped and the job fails.
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: encompute
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: encompute
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      openbao:
        image: openbao/openbao:2.1.0
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add IPC_LOCK
    env:
      ENCOMPUTE_TEST_DATABASE_URL: postgres://encompute:ci-only-password@127.0.0.1:5432/encompute
      ENCOMPUTE_TEST_BAO_ADDR: http://127.0.0.1:8200
      ENCOMPUTE_TEST_BAO_TOKEN: ci-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: ./scripts/install-openfhe.sh
      - run: ./scripts/release-check.sh

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      # On the runner with the pinned toolchain, like the CI job: the
      # container action has no toolchain and scanned the research feature.
      - run: cargo deny check advisories bans sources
