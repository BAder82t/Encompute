name: assurance

# The assurance suite at nightly scale (larger populations, 100 racing
# processes, repeated crash injection) and supply-chain checks. See
# docs/assurance.md.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p encompute-assurance --bins --examples
      - run: ./target/release/assurance-report --nightly --json assurance-report.json --md assurance-report.md
      - if: always()
        run: cat assurance-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assurance-report-nightly
          path: assurance-report.*

  # Every example this machine can run, and every attack in the full
  # collaboration.
  examples-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          maturin develop
      - run: examples/run-all.sh full

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
