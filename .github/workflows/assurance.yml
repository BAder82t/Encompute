name: assurance

# The assurance suite at nightly scale (larger populations, 100 racing
# processes, repeated crash injection) and supply-chain checks. See
# docs/assurance.md.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p encompute-assurance --bins --examples
      - run: ./target/release/assurance-report --nightly --json assurance-report.json --md assurance-report.md
      - if: always()
        run: cat assurance-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-report-nightly
          path: assurance-report.*

  # Every example this machine can run, and every attack in the full
  # collaboration.
  examples-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: cargo build --bins
      - name: python sdk
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "peft==0.12.0"
          maturin develop
      - run: examples/run-all.sh full

  # From a clean checkout to a trusted adapter, with documented commands only.
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: scripts/release-check.sh

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      # On the runner with the pinned toolchain, like the CI job: the
      # container action has no toolchain and scanned the research feature.
      - run: cargo deny check advisories bans sources
