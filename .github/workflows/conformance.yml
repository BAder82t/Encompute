name: conformance

# Full parameter-conformance grids: 10 080 parameter points checked against
# OpenFHE, and 200 random programs executed encrypted. Exact programs: 25 000
# random programs on the mock; OpenFHE exact (BinFHE) on every operation and
# width, random programs and the flagship; research: TFHE-rs, and OpenFHE
# exact against TFHE-rs. Nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/encompute-ckks/src/params.rs"
      - "crates/encompute-ckks/src/lower.rs"
      - "crates/encompute-exact/**"
      - "benches/exact/**"
      - "crates/encompute-openfhe-exact/**"
      - "crates/encompute-openfhe/cpp/binfhe.*"
      - "crates/encompute-openfhe-client/cpp/binclient.cc"
      - "crates/encompute-tfhe/**"
      - "crates/encompute-tfhe-client/**"

env:
  CARGO_TERM_COLOR: always
  ENCOMPUTE_CONFORMANCE: full

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - name: check tier (parameters vs OpenFHE)
        run: cargo test -p encompute-openfhe --release --test conformance -- --nocapture
      - name: run tier (encrypted execution)
        run: cargo test -p encompute-runtime --release --features openfhe --test conformance -- --nocapture

  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: random exact programs on the mock (plan == interpreter == transcript replay)
        run: ENCOMPUTE_EXACT_PROGRAMS=25000 cargo test --release -p encompute-exact --test lower --test transcript -- --nocapture
      - name: every lowering case against the interpreter (exhaustive)
        run: ENCOMPUTE_EXACT_EXHAUSTIVE=1 cargo test --release -p encompute-exact --test lowering_differential -- --nocapture
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - name: OpenFHE exact == clear reference == mock
        env:
          ENCOMPUTE_EXACT_PROGRAMS: "8"
          ENCOMPUTE_EXACT_CASES: "20"
        run: cargo test --release -p encompute-openfhe-client --test exact -- --nocapture --test-threads 1
      - name: OpenFHE exact end to end (sessions, envelopes, HTTP, receipts)
        run: cargo test --release -p encompute-runtime --features openfhe --test openfhe_exact -- --nocapture
      # Timings are informational (shared runners vary); the stable
      # quantities are gated by `encompute-exact --test bench_baseline` in CI.
      - name: timed benchmark, golden exact programs (8 workers)
        continue-on-error: true
        run: |
          cargo run --release -p encompute-openfhe-client --example exact_bench -- \
            --golden --workers 8 --no-reference --history "$RUNNER_TEMP/exact-history.jsonl" \
            | tee "$RUNNER_TEMP/exact-bench.md"
      - name: upload benchmark history lines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-bench-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-history.jsonl
            ${{ runner.temp }}/exact-bench.md
          if-no-files-found: warn
      - name: research differential (OpenFHE exact == TFHE-rs)
        run: cargo test --release -p encompute-runtime --features openfhe,research-tfhe-rs --test cross_backend -- --nocapture
      - name: TFHE-rs (research feature) == clear reference
        env:
          ENCOMPUTE_EXACT_WIDTHS: all
          ENCOMPUTE_EXACT_PROGRAMS: "24"
          ENCOMPUTE_EXACT_CASES: "200"
        run: cargo test --release -p encompute-tfhe-client --features research-tfhe-rs --test exact -- --nocapture --test-threads 1
      - name: TFHE-rs end to end (sessions, envelopes, HTTP, wrong keys)
        run: ENCOMPUTE_EXACT_CASES=100 cargo test --release -p encompute-runtime --features research-tfhe-rs --test exact -- --nocapture

  compose:
    name: Docker Compose deployment (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps/openfhe
          key: openfhe-${{ runner.os }}-${{ hashFiles('scripts/install-openfhe.sh') }}
      - run: ./scripts/install-openfhe.sh
      - run: cargo build --release -p encompute-cli --features encompute-cli/openfhe
      - name: images
        run: |
          docker build -q -f Dockerfile.control -t encompute-control:dev .
          docker build -q -f Dockerfile.services -t encompute-services:dev .
          docker build -q -f Dockerfile.evaluator -t encompute-evaluator:dev .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: smoke (golden path, restart, backup, destroy, restore, revocation)
        env:
          SDK_PYTHON: python3
        run: |
          python -m venv .venv && . .venv/bin/activate && pip install -q maturin numpy cryptography && maturin develop --release
          SDK_PYTHON=$PWD/.venv/bin/python deploy/docker-compose/smoke.sh

