[workspace]
resolver = "2"
members = [
    "crates/encompute-ir",
    "crates/encompute-analysis",
    "crates/encompute-ckks",
    "crates/encompute-backend",
    "crates/encompute-protocol",
    "crates/encompute-openfhe",
    "crates/encompute-openfhe-client",
    "crates/encompute-openfhe-exact",
    "crates/encompute-exact",
    "crates/encompute-tfhe",
    "crates/encompute-tfhe-client",
    "crates/encompute-verification",
    "crates/encompute-vfhe",
    "crates/encompute-attestation",
    "crates/encompute-keybroker",
    "crates/encompute-secagg",
    "crates/encompute-privacy",
    "crates/encompute-trust",
    "crates/encompute-planner",
    "crates/encompute-training",
    "crates/encompute-assurance",
    "crates/encompute-evaluator",
    "crates/encompute-control",
    "crates/encompute-runtime",
    "crates/encompute-cli",
    "crates/encompute-py",
]
# encompute-openfhe links a native OpenFHE install; build it explicitly with
# `-p encompute-openfhe` or `--workspace` once OPENFHE_ROOT is set.
default-members = [
    "crates/encompute-ir",
    "crates/encompute-analysis",
    "crates/encompute-ckks",
    "crates/encompute-backend",
    "crates/encompute-protocol",
    "crates/encompute-exact",
    "crates/encompute-tfhe",
    "crates/encompute-tfhe-client",
    "crates/encompute-verification",
    "crates/encompute-attestation",
    "crates/encompute-keybroker",
    "crates/encompute-secagg",
    "crates/encompute-privacy",
    "crates/encompute-trust",
    "crates/encompute-planner",
    "crates/encompute-training",
    "crates/encompute-assurance",
    "crates/encompute-evaluator",
    "crates/encompute-control",
    "crates/encompute-runtime",
    "crates/encompute-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"

[workspace.dependencies]
encompute-ir = { path = "crates/encompute-ir" }
encompute-analysis = { path = "crates/encompute-analysis" }
encompute-ckks = { path = "crates/encompute-ckks" }
encompute-backend = { path = "crates/encompute-backend" }
encompute-protocol = { path = "crates/encompute-protocol" }
encompute-openfhe = { path = "crates/encompute-openfhe" }
encompute-openfhe-client = { path = "crates/encompute-openfhe-client" }
encompute-openfhe-exact = { path = "crates/encompute-openfhe-exact" }
encompute-exact = { path = "crates/encompute-exact" }
encompute-tfhe = { path = "crates/encompute-tfhe" }
encompute-tfhe-client = { path = "crates/encompute-tfhe-client" }
encompute-verification = { path = "crates/encompute-verification" }
encompute-vfhe = { path = "crates/encompute-vfhe" }
encompute-attestation = { path = "crates/encompute-attestation" }
encompute-keybroker = { path = "crates/encompute-keybroker" }
encompute-secagg = { path = "crates/encompute-secagg" }
encompute-privacy = { path = "crates/encompute-privacy" }
encompute-trust = { path = "crates/encompute-trust" }
encompute-planner = { path = "crates/encompute-planner" }
encompute-training = { path = "crates/encompute-training" }
encompute-evaluator = { path = "crates/encompute-evaluator" }
encompute-control = { path = "crates/encompute-control" }
encompute-runtime = { path = "crates/encompute-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.5"
cxx = "1.0"
cxx-build = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
