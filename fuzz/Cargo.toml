[package]
name = "encompute-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"
description = "cargo-fuzz targets for every Encompute parser (nightly; not a workspace member)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1.0"
serde_json = "1.0"
zeroize = "1.8"
sha2 = "0.10"
ed25519-dalek = "2"
tempfile = "3"
encompute-ir = { path = "../crates/encompute-ir" }
encompute-backend = { path = "../crates/encompute-backend" }
encompute-protocol = { path = "../crates/encompute-protocol" }
encompute-verification = { path = "../crates/encompute-verification" }
encompute-attestation = { path = "../crates/encompute-attestation" }
encompute-trust = { path = "../crates/encompute-trust" }
encompute-privacy = { path = "../crates/encompute-privacy" }
encompute-training = { path = "../crates/encompute-training" }
encompute-secagg = { path = "../crates/encompute-secagg" }
encompute-planner = { path = "../crates/encompute-planner" }
encompute-evaluator = { path = "../crates/encompute-evaluator" }
encompute-control = { path = "../crates/encompute-control" }
encompute-runtime = { path = "../crates/encompute-runtime" }

# Not part of the main workspace: `cargo +nightly fuzz` builds it alone.
[workspace]
members = ["."]

[profile.release]
debug = 1

[lib]
path = "src/lib.rs"

[[example]]
name = "gen_corpus"
path = "examples/gen_corpus.rs"

[[bin]]
name = "eir_parse"
path = "fuzz_targets/eir_parse.rs"
test = false
doc = false
bench = false

