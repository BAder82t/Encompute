[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "encompute"
version = "0.2.0"
description = "Compiler and trust runtime for confidential AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7", "numpy"]
# Confidential fine-tuning (encompute.torch); CPU wheels suffice.
torch = ["torch>=2.2"]

[tool.maturin]
manifest-path = "crates/encompute-py/Cargo.toml"
python-source = "python"
module-name = "encompute._native"
# Encrypted mode: build with `--features openfhe` after scripts/install-openfhe.sh
# (maturin develop --features openfhe, or MATURIN_PEP517_ARGS="--features openfhe").

[tool.pytest.ini_options]
testpaths = ["python/tests"]
