justification = "vulnerable_code_not_in_execute_path"
reason = "Heap buffer overflow in CMS decryption (AES key unwrap) of a crafted CMS message. Nothing in the training workload decrypts CMS or runs a CMP server. Scope: the encompute-training image only (Debian bookworm base, pinned by digest); the encompute-confidential-space image does not report it. Upstream: fixed in Debian 3.0.22-1~deb12u1, not yet in the pinned base; rebase the image and delete this entry when it is."
compensating_controls = [
  "the only OpenSSL user in the running workload is CPython's ssl and hashlib modules (TLS to Google Cloud Storage and the key brokers, digests); neither exposes CMS or CMP, and the encompute native module links no OpenSSL (checked with ldd in encompute-training:rc4)",
  "the openssl command-line tool is present but nothing in the image runs it; the entrypoint is fixed and the launch policy lets the operator override only JOB_URL",
  "follow-up: refresh the python:3.11.16-slim-bookworm digest once it carries 3.0.22-1~deb12u1 (deploy/confidential-space-training/Dockerfile), after which this entry goes stale and is deleted",
]
tracking = "https://nvd.nist.gov/vuln/detail/CVE-2026-63072"
added = 2026-09-29
expires = 2026-12-31
