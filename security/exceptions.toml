# --- Python: Transformers 4.46.3 (pinned; the model package binds 4.46) --------------

[[exception]]
id = "CVE-2026-4372"
package = "transformers"
severity = "critical"
status = "not_affected"
justification = "vulnerable_code_not_present"
reason = """`_attn_implementation_internal` naming a Hub repository whose \
kernel code is downloaded and run. 4.46.3 has no Hub kernel loading: \
_autoset_attn_implementation accepts only eager, sdpa and flash_attention_2 \
and raises otherwise (checked in the installed source). Encompute also \
passes attn_implementation="eager", loads with local_files_only=True, and \
the training image sets HF_HUB_OFFLINE=1. Follow-up: hf::check_config should \
refuse `_attn_implementation*` keys before transformers moves to 5.x."""
expires = 2026-12-31

[[exception]]
id = ["CVE-2024-11392", "CVE-2024-11393", "CVE-2024-11394", "CVE-2025-14920", "CVE-2025-14921", "CVE-2025-14924", "CVE-2025-14930"]
package = "transformers"
severity = "high"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """Pickle deserialization in the MobileViTV2, MaskFormer, Trax, \
Perceiver, Transformer-XL, Megatron-GPT2 and GLM4 code paths. Only BERT, \
DistilBERT and RoBERTa are accepted (hf::check_config), weights are \
safetensors only (use_safetensors=True), and pickled files are refused at \
import."""
expires = 2026-12-31

[[exception]]
