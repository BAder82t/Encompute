# Vulnerability exceptions for a release (docs/release-process.md, "Severity
# policy"). Read by scripts/release/vuln_policy.py:
#
#   * Critical/High pass only with status = "not_affected" and a VEX
#     justification: the vulnerable code is not present or cannot be reached.
#   * Medium passes with status = "accepted_risk" or "not_affected".
#
# Every entry is narrow and complete, or the gate fails (whether or not the
# entry matches a finding):
#
#   id                     one advisory (CVE, GHSA, PYSEC, RUSTSEC, DLA, ...),
#                          matched against the finding's ID and aliases
#   package                the package name as the scanner reports it
#   version                the exact installed version the scanner reports; a
#                          list only for spellings of one release (pip-audit
#                          reads "2.3.1" from the lock, trivy "2.3.1+cpu" in
#                          the image). Another version is not covered.
#   reason, justification  the analysis (justification: a VEX label)
#   compensating_controls  what keeps the vulnerable code unreachable, stated
#                          from the code, with the test or gate that holds it
#   tracking               the upstream advisory or issue (https URL)
#   added, expires         YYYY-MM-DD; at most 183 days apart and from today.
#                          An expired entry fails the gate.
#
# Entries take effect only once approved: the [approval] below covers the
# entries added on or before its approved_on; an entry added later needs the
# release manager to review it and move approved_on (or give the entry its
# own approved_by and approved_on). Until then the "security scans" row of
# scripts/release-check.sh reports FAIL.

[approval]
approved_by = "BAder82t"  # the release manager's GitHub handle, after review
approved_on = "2026-09-27"  # YYYY-MM-DD

# --- Rust ---------------------------------------------------------------------

[[exception]]
id = "RUSTSEC-2023-0071"
package = "rsa"
version = "0.9.10"
severity = "medium"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = "Marvin timing side channel in RSA private-key operations. `rsa` comes in through jsonwebtoken, which production uses only to verify RS256 tokens with public keys (Google's for Confidential Space, the identity provider's for OIDC). No fixed release exists. Also ignored in deny.toml."
compensating_controls = [
  "RS256 is only verified in production (crates/encompute-attestation/src/gcp.rs, crates/encompute-control/src/authn.rs; the control plane's own session tokens are HMAC-signed)",
  "the one RSA signer is the development-only launcher simulator (crates/encompute-cli/src/launcher_sim.rs), with an operator-supplied test key whose tokens a real deployment never accepts",
  "deny.toml records the same advisory with the same reason, so cargo-deny and this file agree",
]
tracking = "https://rustsec.org/advisories/RUSTSEC-2023-0071.html"
added = 2026-09-27
expires = 2026-12-31

# --- Python: PyTorch 2.3.1 (pinned by the confidential training image) --------

[[exception]]
id = "CVE-2025-32434"
package = "torch"
version = ["2.3.1", "2.3.1+cpu"]
severity = "critical"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = "RCE through torch.load with weights_only=True. Encompute never calls torch.load."
compensating_controls = [
  "weights are safetensors only: pickled formats (.bin, .pt, .pth, .pkl, .pickle, .ckpt, .h5, .msgpack, .joblib) are refused at import (crates/encompute-training/src/hf.rs; python/tests/test_huggingface.py::test_unsafe_repositories_are_refused) and models load with use_safetensors=True, local_files_only=True (python/encompute/torch/hf.py)",
  "python/encompute's source references no torch.load (nor torch.serialization, torch.hub, torch.package), torch.jit, torch.compile/_dynamo/Inductor, torch.export, torch.fx, torch.onnx, torch.distributed, torch.profiler, Transformers Trainer or accelerate load_checkpoint_*, whether directly, through an import alias or from-import, or by getattr or import_module with a literal name: scripts/release/scan_torch_usage.py, a static scan of the syntax tree run by the 'exception controls' row of scripts/release/scan.sh, fails the release gate if it does (a module named only at run time is beyond a static scan; the factories the worker imports by name are allowlisted in encompute.torch.models.FACTORIES)",
  "in the training image the entrypoint is fixed (python -m encompute.torch.cs_worker), the launch policy lets the operator set only JOB_URL, HF_HUB_OFFLINE=1 and TRANSFORMERS_OFFLINE=1 are set, and key brokers release keys only to the approved image digest",
]
tracking = "https://github.com/advisories/GHSA-53q9-r3pm-6pq6"
added = 2026-09-27
expires = 2026-12-31

