# --- Containers (Debian 12 base) -------------------------------------------------
# Debian packages with no fixed version in the distribution are reported,
# not blocking (docs/release-process.md). Fixed ones must be fixed by a
# refreshed base digest or listed here.

[[exception]]
id = "DLA-4792-1"
package = "tzdata"
severity = "unknown"
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
reason = """A time-zone data update (2026b to 2026c), not a code flaw; the \
current debian:bookworm-slim digest still ships 2026b. The services log and \
compare times in UTC and take no security decision on local time rules. \
Refresh the base digest when Debian publishes it."""
expires = 2026-12-31
