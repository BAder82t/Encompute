[[exception]]
id = ["CVE-2025-55551", "CVE-2025-55552", "CVE-2025-55554", "CVE-2025-2998", "CVE-2025-2999", "CVE-2025-3730", "CVE-2025-2953", "CVE-2025-46148", "CVE-2025-3001", "CVE-2025-2149"]
package = "torch"
severity = "high"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """Local crashes or wrong results in operators the supported models \
never call: linalg.lu, rot90 with randn_like, nan_to_num, rnn \
pad_packed_sequence/unpack_sequence, lstm_cell, ctc_loss, mkldnn_max_pool2d, \
