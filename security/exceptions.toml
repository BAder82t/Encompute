# Vulnerability exceptions for a release (docs/release-process.md, "Severity
# policy"). Read by scripts/release/vuln_policy.py:
#
#   * Critical/High pass only with status = "not_affected" and a VEX
#     justification: the vulnerable code is not present or cannot be reached.
#   * Medium passes with status = "accepted_risk" or "not_affected".
#   * Every entry has a reason and an expiry at most 183 days away; an
#     expired entry blocks the release again.
#   * `id` matches the finding's ID or any alias (CVE, GHSA, PYSEC, RUSTSEC);
#     `package` is the package name as the scanner reports it.
#
# Entries are proposed by whoever runs the scan and take effect only once
# approved: set `approved_by` below (or on an entry). Until then the
# "security scans" row of scripts/release-check.sh reports FAIL.

[approval]
approved_by = ""          # the release manager's GitHub handle, after review
approved_on = ""          # YYYY-MM-DD

# --- Rust --------------------------------------------------------------------------

[[exception]]
id = "RUSTSEC-2023-0071"
package = "rsa"
severity = "medium"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """Marvin timing side channel in RSA *private-key* operations. `rsa` \
comes in through jsonwebtoken, which production uses only to verify RS256 \
Confidential Space tokens with Google's public keys; only tests sign. No fixed \
release exists. Also ignored in deny.toml."""
expires = 2026-12-31

# --- Python: PyTorch 2.3.1 (pinned by the confidential training image) --------------
# Encompute never calls torch.load, torch.jit, torch.compile/Inductor,
# torch.export or torch.distributed: models are rebuilt from Transformers
# configurations and weights are read from safetensors (python/encompute/torch).
# Upgrading torch changes the model package binding (major.minor) and the
# training image digest; it is planned after 0.3 (docs/release-process.md).

[[exception]]
id = ["CVE-2025-32434", "CVE-2026-24747"]
package = "torch"
severity = "critical"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """RCE through torch.load (weights_only bypasses). Encompute never \
calls torch.load: weights are safetensors only, and pickled weights are \
refused at import (encompute.torch.hf, _check_files)."""
expires = 2026-12-31

[[exception]]
id = "CVE-2024-48063"
package = "torch"
severity = "critical"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """torch.distributed.rpc RemoteModule deserialization (disputed). \
Encompute uses no torch.distributed; workers exchange sealed updates through \
its own secure aggregation."""
expires = 2026-12-31

[[exception]]
id = ["CVE-2025-55553", "CVE-2025-55557", "CVE-2025-55558", "CVE-2025-55560", "CVE-2026-4538", "CVE-2025-3000", "CVE-2025-2148"]
package = "torch"
severity = "high"
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
reason = """Crashes in torch.compile/Inductor, proxy_tensor (FX tracing), \
