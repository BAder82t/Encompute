[package]
name = "encompute-cli"
description = "The encompute command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "encompute"
path = "src/main.rs"

[dependencies]
encompute-ir.workspace = true
encompute-runtime.workspace = true
serde_json.workspace = true
clap = { version = "~4.5", features = ["derive"] }

[features]
openfhe = ["encompute-runtime/openfhe"]

[lints]
workspace = true
