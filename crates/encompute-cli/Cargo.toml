[package]
name = "encompute-cli"
description = "The encompute command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "encompute"
path = "src/main.rs"

[dependencies]
encompute-ir.workspace = true
encompute-runtime.workspace = true
encompute-protocol.workspace = true
serde_json.workspace = true
clap = { version = "~4.5", features = ["derive"] }
tiny_http = "0.12"
zeroize = "1.8"

[dev-dependencies]
encompute-evaluator.workspace = true

[features]
openfhe = ["encompute-runtime/openfhe"]
# Research use only: TFHE-rs requires a patent license from Zama for commercial use.
tfhe-rs = ["encompute-runtime/tfhe-rs"]
# Research: verify execution proofs (re-execution on OpenFHE BGV, ADR-009).
vfhe-research = ["encompute-runtime/vfhe-research"]

[lints]
workspace = true
