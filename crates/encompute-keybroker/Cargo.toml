[package]
name = "encompute-keybroker"
description = "Policy-gated key release to attested Encompute workloads"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true

[dependencies]
encompute-ir.workspace = true
encompute-attestation.workspace = true
encompute-verification.workspace = true
encompute-trust.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom = "0.2"
zeroize = "1.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = "2.2"
ureq = { version = "2.12", default-features = false, features = ["json"] }
# Throwaway certificates for the TLS tests (ring, never aws-lc).
rcgen = "0.14"

[lints]
workspace = true
