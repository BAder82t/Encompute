[package]
name = "encompute-privacy"
description = "Differential privacy for Encompute: budgets, discrete Gaussian noise, zCDP accounting, ledger, receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# No ML framework, no FHE backend, no cloud SDK.
[dependencies]
encompute-ir.workspace = true
encompute-verification.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1.8"
ed25519-dalek = "2.2"
chacha20 = "0.10"
libm = "0.2.16"
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
getrandom = "0.2"

[features]
# Reproducible noise for tests. Every sample is labelled; production
# verification refuses it. Never enable in a release build.
insecure-deterministic-noise = []
# Crash injection points for the assurance suite (ENCOMPUTE_FAILPOINT).
failpoints = []

[lints]
workspace = true
