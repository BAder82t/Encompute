[package]
name = "encompute-evaluator"
description = "Encompute evaluator: runs compiled plans on encrypted inputs; holds no secret key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Must never depend (directly or transitively) on encompute-openfhe-client,
# encompute-tfhe-client or encompute-runtime: the evaluator binary may not
# link client crypto.
[dependencies]
encompute-ir.workspace = true
encompute-ckks.workspace = true
encompute-backend.workspace = true
encompute-protocol.workspace = true
encompute-analysis.workspace = true
encompute-exact.workspace = true
encompute-verification.workspace = true
encompute-attestation.workspace = true
encompute-openfhe = { workspace = true, optional = true }
# Evaluator half of TFHE-rs only; encompute-tfhe-client is never linked here.
encompute-tfhe.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
libc = "0.2"

[features]
openfhe = ["dep:encompute-openfhe"]
# Research use only; see encompute-tfhe.
tfhe-rs = ["encompute-tfhe/tfhe-rs"]

[[bin]]
name = "encompute-evaluator"
path = "src/main.rs"

[lints]
workspace = true
