[package]
name = "encompute-runtime"
description = "Encompute executor, differential testing and compiled artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encompute-ir.workspace = true
encompute-ckks.workspace = true
encompute-backend.workspace = true
encompute-protocol.workspace = true
encompute-evaluator.workspace = true
encompute-openfhe-client = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tiny_http = "0.12"
proptest.workspace = true
encompute-analysis.workspace = true
ureq = { version = "2.12", default-features = false }

[features]
openfhe = ["encompute-evaluator/openfhe", "dep:encompute-openfhe-client"]

[lints]
workspace = true
