[package]
name = "encompute-runtime"
description = "Encompute executor, differential testing and compiled artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encompute-ir.workspace = true
encompute-ckks.workspace = true
encompute-backend.workspace = true
encompute-protocol.workspace = true
encompute-evaluator.workspace = true
encompute-openfhe-client = { workspace = true, optional = true }
encompute-analysis.workspace = true
encompute-exact.workspace = true
encompute-verification.workspace = true
encompute-attestation.workspace = true
encompute-keybroker.workspace = true
encompute-secagg.workspace = true
encompute-privacy.workspace = true
encompute-trust.workspace = true
encompute-planner.workspace = true
encompute-training.workspace = true
encompute-tfhe.workspace = true
encompute-tfhe-client = { workspace = true, optional = true }
encompute-vfhe = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
ed25519-dalek = "2.2"
tiny_http = "0.12"
proptest.workspace = true
ureq = { version = "2.12", default-features = false }

[features]
openfhe = ["encompute-evaluator/openfhe", "dep:encompute-openfhe-client"]
# Research use only: TFHE-rs requires a patent license from Zama for commercial use.
tfhe-rs = ["encompute-evaluator/tfhe-rs", "encompute-tfhe-client/tfhe-rs"]
# Research: verify execution proofs (re-execution on OpenFHE BGV, ADR-009).
vfhe-research = ["openfhe", "dep:encompute-vfhe"]

[lints]
workspace = true
