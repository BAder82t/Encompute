[package]
name = "encompute-py"
description = "Python bindings for Encompute (distribution: encompute)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
encompute-ir.workspace = true
encompute-ckks.workspace = true
encompute-backend.workspace = true
encompute-runtime.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.29"

[features]
openfhe = ["encompute-runtime/openfhe"]
# Research use only: TFHE-rs requires a patent license from Zama for commercial use.
tfhe-rs = ["encompute-runtime/tfhe-rs"]
# Research: verified execution (re-execution on OpenFHE BGV, ADR-009).
vfhe-research = ["encompute-runtime/vfhe-research"]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[lints]
workspace = true
