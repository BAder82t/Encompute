[package]
name = "encompute-control"
description = "Encompute control plane: organizations, projects, assets, plans, jobs, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encompute-ir.workspace = true
encompute-verification.workspace = true
encompute-planner.workspace = true
encompute-privacy.workspace = true
encompute-evaluator.workspace = true
encompute-analysis.workspace = true
encompute-ckks.workspace = true
encompute-exact.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1.8"
ed25519-dalek = "2.2"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
base64 = "0.22"
r2d2 = "0.8"
r2d2_postgres = "0.18"

[dev-dependencies]
p256 = { version = "0.13", features = ["pkcs8", "jwk", "pem", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "encompute-control"
path = "src/main.rs"

[lints]
workspace = true
