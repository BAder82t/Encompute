[package]
name = "encompute-attestation"
description = "Provider-neutral workload attestation, session binding and key grants for Encompute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# No FHE backend and no cloud SDK: providers verify evidence from bytes.
[dependencies]
encompute-ir.workspace = true
encompute-verification.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ed25519-dalek = "2.2"
getrandom = "0.2"
zeroize = "1.8"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "hkdfsha2", "getrandom", "alloc"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }

[lints]
workspace = true
