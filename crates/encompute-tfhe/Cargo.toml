[package]
name = "encompute-tfhe"
description = "TFHE-rs implementation of Encompute's exact evaluator (research use only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
encompute-ir.workspace = true
encompute-backend.workspace = true
encompute-exact.workspace = true
# TFHE-rs source is BSD-3-Clause-Clear; Zama states that commercial use of its
# technology requires a separate patent license. Keeping it behind an
# off-by-default feature does not change that requirement.
tfhe = { version = "=1.8.1", default-features = false, features = ["integer"], optional = true }

[features]
research-tfhe-rs = ["dep:tfhe"]

[lints]
workspace = true
