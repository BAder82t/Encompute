# Builds the training worker image natively (linux/amd64) on Cloud Build.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, "VARIANT=${_VARIANT}", -f, deploy/confidential-space-training/Dockerfile, -t, "${_IMAGE}", .]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
