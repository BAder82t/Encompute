; The control plane's database connection. The control plane speaks
; PostgreSQL without TLS (it has no TLS client), so it connects to this
; sidecar on its own loopback (they share a network namespace), and the
; sidecar speaks TLS to PostgreSQL: it verifies the server's certificate
; chain AND name (the equivalent of sslmode=verify-full), and presents the
; client certificate the database requires.
foreground = yes
debug = notice
sslVersionMin = TLSv1.2

[postgres]
client = yes
protocol = pgsql
accept = 127.0.0.1:5432
connect = postgres:5432
verifyChain = yes
CAfile = /run/secrets/internal-ca.crt
checkHost = postgres
cert = /run/secrets/pg-client.crt
key = /run/secrets/pg-client.key
