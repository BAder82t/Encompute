# PostgreSQL host-based authentication for the reference production topology.
# Network connections must use TLS, present a client certificate whose CN is
# the role name, and still prove the password. Everything else is rejected:
# there is no plaintext `host` rule that accepts, and no `trust` over the
# network. The local socket is reachable only from inside the container
# (docker exec), which is how backup.sh and restore.sh work.
local   all   all                                   trust
hostssl all   all   0.0.0.0/0   scram-sha-256   clientcert=verify-full
hostssl all   all   ::/0        scram-sha-256   clientcert=verify-full
host    all   all   0.0.0.0/0   reject
host    all   all   ::/0        reject
